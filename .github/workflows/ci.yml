name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false   # no go.sum: there are no dependencies to cache
      - name: UI typecheck, tests and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet and tests (race detector)
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh
      - name: build both architectures
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/vesper ./cmd/vesper
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/vesper-arm64 ./cmd/vesper
          ls -la bin
      - name: the live demo builds, says what vesper demo says, and stays out of the binary
        run: |
          make pages
          node scripts/wasm-parity.mjs pages bin/vesper
          if grep -rqE 'vesperDemo|demo\.wasm' internal/web/ui/dist; then
            echo "the UI inside the binary carries demo code" >&2
            exit 1
          fi

      - name: systemd unit files are valid
        run: |
          sudo install -m 755 bin/vesper /usr/local/bin/vesper
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.socket
      - name: end to end under systemd, with Docker and Caddy
        run: sudo scripts/e2e.sh bin/vesper
      - uses: actions/upload-artifact@v7
        with:
          name: vesper-linux
          path: bin/

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:latest git /repo --no-banner --redact
