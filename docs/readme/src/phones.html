<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cockpit on a phone</title>
<link rel="stylesheet" href="base.css">
<style>
  .card { padding: 44px 40px 30px; }
  .row { display: flex; justify-content: center; align-items: flex-start; gap: 46px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .col:nth-child(2) { margin-top: 34px; }
  .phone { width: 262px; }
  .cap { font: 600 14px/1.3 var(--sans); color: var(--ink); text-align: center; }
  .cap span { display: block; margin-top: 3px; font: 400 12.5px/1.4 var(--sans); color: var(--muted); }
  @media (max-width: 700px) {
    .card { padding: 30px 18px 22px; }
    .row { gap: 16px; }
    .col:nth-child(3) { display: none; }
    .col:nth-child(2) { margin-top: 26px; }
    .phone { width: 232px; border-radius: 34px; padding: 7px; }
    .phone img { border-radius: 28px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="col"><div class="phone"><img src="shots/mob-overview-inc.png"></div><div class="cap">Something is down<span>worst first, with its runbook</span></div></div>
    <div class="col"><div class="phone"><img src="shots/mob-runbook.png"></div><div class="cap">The runbook<span>your own Markdown, rendered safely</span></div></div>
    <div class="col"><div class="phone"><img src="shots/mob-timers.png"></div><div class="cap">What runs next<span>every systemd timer, counting down</span></div></div>
  </div>
  <p class="source">synthetic data from <b>cockpit demo -scenario incident</b> · add it to the home screen</p>
</div>
</body>
</html>
