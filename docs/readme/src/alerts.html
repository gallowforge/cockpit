<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cockpit: incidents, not noise</title><link rel="stylesheet" href="base.css">
<style>
  /* One idea: every push becomes an incident with a beginning and an end. */
  .frame { padding: 48px 40px 64px; --hz: 93%; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 26px; }
  .head h2 { margin-top: 12px; font: 600 46px/1 var(--cond); }
  .head p { max-width: 380px; text-align: right; font: 400 15.5px/1.5 var(--sans); color: var(--text-2); }
  @media (max-width: 700px) {
    .frame { padding: 32px 24px 34px; }
    .head { flex-direction: column; align-items: flex-start; gap: 12px; } .head p { text-align: left; }
    .narrow { width: 340px; margin: 0 auto; }
  }
</style></head>
<body>
<div class="frame"><div class="ground"></div>
  <div class="head"><div><span class="kicker">Alerts</span><h2>Incidents, not noise</h2></div>
    <p>Each push, its repeats and its all-clear become one line with a beginning and an end. <span class="caption">demo data</span></p></div>
  <div class="wide screen"><div class="crop" style="--x:274;--y:447;--w:1128;--h:453;--k:0.9043"><img src="shots/alerts.png"></div></div>
  <div class="narrow"><div class="phone"><img src="shots/mob-alerts.png"></div></div>
</div>
</body></html>
