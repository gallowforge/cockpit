<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cockpit social preview</title><link rel="stylesheet" href="base.css">
<style>
  body { width: 1280px; height: 640px; }
  .frame { width: 1280px; height: 640px; border-radius: 0; --hz: 76%; }
  .copy { position: absolute; left: 80px; top: 92px; }
  h1 { font: 700 150px/0.84 var(--cond); letter-spacing: -0.01em; }
  .tag { margin-top: 30px; font: 500 42px/1.15 var(--sans); }
  .tag em { font-style: normal; color: var(--text-2); }
  .stage { position: absolute; left: 640px; width: 600px; bottom: calc(24% - 1px); }
  .stage .screen { border-radius: 12px 12px 0 0; }
  .what { position: absolute; left: 80px; bottom: 58px; font: 500 22px/1.3 var(--sans); color: var(--text-2); }
  .what b { color: var(--text); font-weight: 600; }
  .what span { color: var(--muted); margin: 0 10px; }
</style></head>
<body>
<div class="frame"><div class="ground"></div>
  <div class="copy"><h1>Cockpit</h1><p class="tag">Level flight.<br><em>Nothing needs you.</em></p></div>
  <div class="stage"><div class="screen"><div class="crop" style="--x:274;--y:30;--w:1128;--h:620;--k:0.532"><img src="shots/overview-calm.png"></div></div></div>
  <p class="what"><b>A read-only dashboard for your homelab</b><span>·</span>services, backups, alerts, timers, drift<span>·</span>one 8 MB binary</p>
</div>
</body></html>
