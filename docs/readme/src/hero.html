<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cockpit</title><link rel="stylesheet" href="base.css">
<style>
  /* One idea: level flight. When the horizon is calm and blue, nothing needs you. */
  .frame { height: 600px; --hz: 86%; }
  .copy { position: absolute; left: 64px; top: 64px; width: 410px; }
  h1 { font: 700 104px/0.86 var(--cond); letter-spacing: -0.01em; }
  .tag { margin-top: 26px; font: 500 30px/1.18 var(--sans); color: var(--text); }
  .tag em { font-style: normal; color: var(--text-2); }
  .sub { margin-top: 20px; font: 400 16.5px/1.55 var(--sans); color: var(--text-2); max-width: 390px; }
  .stage { position: absolute; left: 474px; width: 596px; bottom: calc(14% - 1px); }
  .stage .screen { border-radius: 12px 12px 0 0; }
  .reflect { position: absolute; left: 470px; width: 600px; top: 77%; height: 110px; overflow: hidden; opacity: 0.16; transform: scaleY(-1); transform-origin: top;
    mask-image: linear-gradient(0deg, #000, transparent 80%); -webkit-mask-image: linear-gradient(0deg, #000, transparent 80%); }
  .reflect .crop { position: absolute; bottom: 0; left: 0; right: 0; }
  .foot { position: absolute; left: 64px; bottom: 26px; }
  @media (max-width: 700px) {
    .frame { height: 1210px; --hz: 85%; }
    .copy { left: 36px; top: 50px; width: 470px; }
    h1 { font-size: 92px; }
    .tag { font-size: 27px; }
    .sub { max-width: none; font-size: 16px; }
    .stage { left: 120px; width: 300px; bottom: 15%; }
    .stage .phone { border-radius: 40px 40px 0 0; padding-bottom: 0; }
    .stage .phone img { border-radius: 3px 3px 0 0; }
    .reflect, .foot { display: none; }
  }
</style></head>
<body>
<div class="frame"><div class="ground"></div>
  <div class="copy">
    <h1>Cockpit</h1>
    <p class="tag">Level flight.<br><em>Nothing needs you.</em></p>
    <p class="sub">The flight deck of your homelab: service health, proven backups, every alert, timers and config drift on one calm screen that lights up only when something needs you. Read-only. One 8 MB binary.</p>
  </div>
  <div class="stage wide"><div class="screen"><div class="crop" style="--x:274;--y:30;--w:1128;--h:620;--k:0.532"><img src="shots/overview-calm.png"></div></div></div>
  <div class="stage narrow"><div class="phone"><img src="shots/mob-overview-calm.png" style="height: 606px; object-fit: cover; object-position: top"></div></div>
  <p class="foot caption">synthetic data from <b>cockpit demo</b></p>
</div>
</body></html>
