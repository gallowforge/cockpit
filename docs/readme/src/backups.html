<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cockpit: backups that came back</title><link rel="stylesheet" href="base.css">
<style>
  /* One idea: a backup only counts once it has come back. */
  .frame { height: 560px; --hz: 90%; }
  .statement { position: absolute; left: 48px; top: 54px; width: 300px; }
  .statement h2 { margin-top: 14px; font: 600 52px/0.98 var(--cond); }
  .statement h2 em { font-style: normal; color: var(--green); }
  .statement p { margin-top: 18px; font: 400 16px/1.55 var(--sans); color: var(--text-2); }
  .desk { position: absolute; right: 40px; top: 46px; width: 680px; }
  .cap { position: absolute; left: 48px; bottom: 20px; }
  @media (max-width: 700px) {
    .frame { height: 1040px; --hz: 94%; }
    .statement { left: 28px; top: 34px; width: 480px; } .statement h2 { font-size: 46px; }
    .desk { display: none; }
    .ph { position: absolute; left: 100px; top: 360px; width: 340px; }
    .cap { left: auto; right: 28px; top: 34px; bottom: auto; }
  }
  @media (min-width: 701px) { .ph { display: none; } }
</style></head>
<body>
<div class="frame"><div class="ground"></div>
  <div class="statement"><span class="kicker">Backups</span><h2>A backup counts once it has <em>come back.</em></h2>
    <p>Thirty nights of runs, their run times, and every week's restore drill, set by set.</p></div>
  <div class="desk screen"><div class="crop" style="--x:274;--y:824;--w:1128;--h:600;--k:0.6028"><img src="shots/backups.png"></div></div>
  <div class="ph phone"><img src="shots/mob-backups.png"></div>
  <p class="cap caption">demo data · <b>cockpit demo</b></p>
</div>
</body></html>
