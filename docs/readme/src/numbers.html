<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cockpit numbers</title><link rel="stylesheet" href="base.css">
<style>
  /* One idea: the facts as readouts on the horizon, the way a head-up display shows them. */
  .frame { height: 250px; --hz: 74%; }
  .row { position: absolute; left: 0; right: 0; top: 34px; display: grid; grid-template-columns: repeat(6, 1fr); padding: 0 34px; }
  .n { padding: 0 18px; }
  .n + .n { box-shadow: inset 1px 0 0 rgba(255,255,255,.08); }
  .n b { display: block; font: 600 66px/1 var(--cond); letter-spacing: -0.01em; color: var(--text); white-space: nowrap; }
  .n b small { font-size: 0.42em; color: var(--text-2); margin-left: 3px; font-weight: 500; }
  .n h3 { margin-top: 10px; font: 600 15.5px/1.2 var(--sans); color: var(--text); white-space: nowrap; }
  .n p { margin-top: 3px; font: 400 13.5px/1.3 var(--sans); color: var(--muted); white-space: nowrap; }
  @media (max-width: 700px) {
    .frame { height: 560px; --hz: 92%; }
    .row { grid-template-columns: 1fr 1fr; row-gap: 32px; top: 36px; padding: 0 20px; }
    .n:nth-child(odd) { box-shadow: none; }
    .n b { font-size: 62px; }
  }
</style></head>
<body>
<div class="frame"><div class="ground"></div>
  <div class="row">
    <div class="n"><b>8<small>MB</small></b><h3>One binary</h3><p>the UI is inside</p></div>
    <div class="n"><b>0</b><h3>Go dependencies</h3><p>standard library only</p></div>
    <div class="n"><b>27<small>MB</small></b><h3>RAM on a Pi 5</h3><p>collector and web</p></div>
    <div class="n"><b>0.8<small>%</small></b><h3>Of one CPU core</h3><p>sampling every 20 s</p></div>
    <div class="n"><b>33</b><h3>End-to-end checks</h3><p>under real systemd</p></div>
    <div class="n"><b>0</b><h3>Ways to change</h3><p>every route only reads</p></div>
  </div>
</div>
</body></html>
