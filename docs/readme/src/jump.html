<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cockpit: one keystroke to anywhere</title><link rel="stylesheet" href="base.css">
<style>
  /* One idea: every service, set, alert, timer and checklist is one keystroke away. */
  .frame { height: 520px; --hz: 90%; }
  .head { position: absolute; left: 48px; top: 54px; width: 330px; }
  .head h2 { margin-top: 14px; font: 600 50px/0.98 var(--cond); }
  .head p { margin-top: 18px; font: 400 16px/1.55 var(--sans); color: var(--text-2); }
  .keys { margin-top: 22px; display: flex; gap: 8px; align-items: center; color: var(--muted); font: 500 14px/1 var(--sans); }
  .keys kbd { display: inline-grid; place-items: center; min-width: 34px; height: 34px; padding: 0 9px; border-radius: 8px; font: 600 15px/1 var(--sans); color: var(--text);
    background: linear-gradient(180deg, #1a2330, #111821); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 #05080c, 0 0 0 1px rgba(170,195,230,.16); }
  .pal { position: absolute; right: 44px; top: 50px; width: 640px; }
  .pal .screen { border-radius: 16px; }
  .cap { position: absolute; left: 48px; bottom: 18px; }
  @media (max-width: 700px) {
    .frame { height: 820px; --hz: 94%; }
    .head { left: 28px; top: 34px; width: 480px; } .head h2 { font-size: 44px; }
    .pal { left: 20px; right: 20px; top: 360px; width: auto; }
    .cap { left: 28px; bottom: 12px; }
  }
</style></head>
<body>
<div class="frame"><div class="ground"></div>
  <div class="head"><span class="kicker">Command bar</span><h2>One keystroke to anywhere</h2>
    <p>Type three letters and land on the service, the backup set, the alert or the checklist. Open any app from the same box.</p>
    <div class="keys"><kbd>⌘</kbd><kbd>K</kbd><span>or</span><kbd>/</kbd><span>then</span><kbd>G</kbd><kbd>B</kbd><span>for backups</span></div></div>
  <div class="pal"><div class="screen"><div class="crop" style="--x:390;--y:117;--w:660;--h:330;--k:0.9697"><img src="shots/palette.png"></div></div></div>
  <p class="cap caption">demo data · <b>cockpit demo</b></p>
</div>
</body></html>
