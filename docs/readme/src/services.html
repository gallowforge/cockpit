<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cockpit: probed like a client</title><link rel="stylesheet" href="base.css">
<style>
  /* One idea: every service is checked the way your phone reaches it, on any screen you hold. */
  .frame { height: 600px; --hz: 88%; }
  .head { position: absolute; left: 44px; top: 40px; }
  .head h2 { margin-top: 12px; font: 600 40px/1.02 var(--cond); max-width: 270px; }
  .desk { position: absolute; left: 350px; top: 44px; width: 710px; }
  .phone { position: absolute; left: 70px; bottom: calc(12% - 1px); width: 236px; border-radius: 40px 40px 0 0; padding-bottom: 0; }
  .phone img { border-radius: 3px 3px 0 0; height: 300px; object-fit: cover; object-position: top; }
  .cap { position: absolute; right: 40px; bottom: 22px; }
  @media (max-width: 700px) {
    .frame { height: 900px; --hz: 90%; }
    .head { left: 28px; top: 32px; } .head h2 { font-size: 34px; max-width: none; }
    .desk { display: none; }
    .phone { left: 120px; width: 300px; } .phone img { height: 560px; }
    .cap { right: auto; left: 28px; bottom: 18px; }
  }
</style></head>
<body>
<div class="frame"><div class="ground"></div>
  <div class="head"><span class="kicker">Services</span><h2>Probed the way your phone sees it</h2></div>
  <div class="desk screen"><div class="crop" style="--x:274;--y:422;--w:1128;--h:456;--k:0.6294"><img src="shots/services-open.png"></div></div>
  <div class="phone"><img src="shots/mob-services.png"></div>
  <p class="cap caption">demo data · <b>cockpit demo</b></p>
</div>
</body></html>
